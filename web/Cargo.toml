[package]
name = "keycraft-web"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
datacraft-keys-proto = { path = "../../datacraft/crates/keys-proto" }
craftworks-page = { path = "../../common/crates/craftworks-page" }
freenet-vfs = { path = "../../../freenet/freenet-vfs/crates/freenet-vfs", default-features = false, features = ["browser"] }
freenet-sql = { path = "../../../freenet/freenet-sql/crates/freenet-sql", default-features = false, features = ["browser"] }
freenet-pages = { path = "../../../freenet/freenet-pages/crates/freenet-pages", default-features = false, features = ["browser"] }
freenet-blob = { path = "../../../freenet/freenet-blob/crates/freenet-blob", default-features = false, features = ["browser"] }
freenet-stdlib = { version = "0.10.0", features = ["net"] }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console", "Performance", "Window"] }
console_error_panic_hook = "0.1"
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
opt-level = "s"
lto = true
