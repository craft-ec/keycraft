[package]
name = "keycraft-host"
version = "0.1.0"
edition = "2021"
publish = false
description = "Reads every delegate's secrets in a Freenet node's data directory for the keycraft extension (Chrome native messaging)"

[workspace]

[dependencies]
blake3 = "1"
ed25519-dalek = "2"
bs58 = "0.5"
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
base64 = "0.22"
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
datacraft-keys-proto = { path = "../../datacraft/crates/keys-proto" }
